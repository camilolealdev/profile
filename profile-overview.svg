<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" class="profile-overview">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2d51" />
      <stop offset="100%" stop-color="#16213e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)" />
  
  <!-- Decorative card -->
  <rect x="60" y="80" width="680" height="260" rx="20" ry="20" fill="url(#cardGrad)" filter="url(#shadow)" />
  
  <!-- Left accent -->
  <path d="M60 80 L60 340 M60 80 Q100 40 160 80" stroke="#a371f7" stroke-width="3" fill="none" />
  
  <!-- Right accent -->
  <path d="M740 80 L740 340 M740 80 Q700 40 640 80" stroke="#a371f7" stroke-width="3" fill="none" />
  
  <!-- Avatar placeholder -->
  <circle cx="120" cy="180" r="50" fill="#e94560" />
  <text x="120" y="195" fill="white" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">CL</text>
  
  <!-- Name -->
  <text x="200" y="180" fill="white" font-family="Arial, sans-serif" font-size="32" font-weight="bold">Camilo Leal</text>
  
  <!-- Role -->
  <text x="200" y="220" fill="#a371f7" font-family="Arial, sans-serif" font-size="18">AI Automation & Full Stack Developer</text>
  
  <!-- Divider -->
  <line x1="200" y1="245" x2="600" y2="245" stroke="#a371f7" stroke-width="1" opacity="0.5" />
  
  <!-- About text -->
  <text x="200" y="270" fill="#a371f7" font-family="Arial, sans-serif" font-size="14" width="400">
    Technology professional with 18+ years of experience building practical business solutions at the intersection of technology, business, and customer experience.
  </text>
  
  <!-- Focus areas pills -->
  <g>
    <g>
      <rect x="200" y="310" width="80" height="25" rx="12" ry="12" fill="#a371f7" />
      <text x="140" y="320" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">AI</text>
    </g>
    <g>
      <rect x="300" y="310" width="80" height="25" rx="12" ry="12" fill="#6366f1" />
      <text x="265" y="320" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Full Stack</text>
    </g>
    <g>
      <rect x="400" y="310" width="80" height="25" rx="12" ry="12" fill="#10b981" />
      <text x="315" y="320" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Automation</text>
    </g>
    <g>
      <rect x="500" y="310" width="80" height="25" rx="12" ry="12" fill="#f59e0b" />
      <text x="415" y="320" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">BI</text>
    </g>
  </g>
  
  <!-- Bottom decorative line -->
  <line x1="60" y1="380" x2="740" y2="380" stroke="#a371f7" stroke-width="1" opacity="0.3" />
</svg>