<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" class="cappy-banner">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a371f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9d8fd;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background shape -->
  <path d="M0 200 Q600 0 1200 200 L1200 250 L0 250 Z" fill="url(#grad1)" />
  
  <!-- Decorative elements -->
  <circle cx="150" cy="100" r="30" fill="rgba(255,255,255,0.1)" />
  <circle cx="400" cy="150" r="40" fill="rgba(255,255,255,0.1)" />
  <circle cx="800" cy="120" r="35" fill="rgba(255,255,255,0.1)" />
  <circle cx="1000" cy="180" r="45" fill="rgba(255,255,255,0.1)" />
  
  <!-- Main text -->
  <text x="600" y="110" fill="white" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" transform="rotate(0 600 110)">
    <tspan x="600" dy="-30">Camilo Leal</tspan>
  </text>
  
  <text x="600" y="160" fill="#a371f7" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" transform="rotate(0 600 160)">
    <tspan x="600" dy="-10">AI Automation & Full Stack Developer</tspan>
    <tspan x="600" dy="20">Digital Innovation Professional</tspan>
  </text>
  
  <!-- Accent line -->
  <rect x="580" y="195" width="40" height="4" fill="#a371f7" />
</svg>